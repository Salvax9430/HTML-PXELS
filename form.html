<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>
<body>
    
   <h1><u>Contact Forms</u></h1>
   <form action="">
    <label for="fname">First Name:</label>
    <input type="text" id="fname" name="fname" placeholder="Bramuel"><br><br>
    <label for="lname">Last Name:</label>
    <input type="text" id="lname" name="lname" placeholder="Sifuna"><br><br>
    <label for="email">Email:</label> 
    <input type="email" id="email" name="email" placeholder="sifunabramuel9430@gmail.com"><br><br>
    
    <input type="text" id="subject" name="subject"><br><br>
    <label for="gender">Gender:</label>
   
    <select name="gender" id="gender">
        <option value="male">Male</option>
        <option value="female">Female</option>
    </select><br><br>
   
    
    <label for="upload">Upload File:</label>
    <input type="file" id="upload" name="upload"><br><br>
    <label for="Password">Password:</label>
    <input type="password" id="password" name="password"><br><br>
    <label for="date">Date:</label>
    <input type="date" id="date" name="date"><br><br>
    <label for="color">Color:</label>
    <input type="color" id="color" name="color"><br><br>
    <label for="Message">Message:</label>
    <textarea name="message" id="message" cols="60" rows="5" placeholder="Enter your message here........."></textarea><br><br>
    <label for="subject">Subject:</label>
    <input type="submit" id="submit" name="submit"><br><br>
   </form>
   
</body>
</html>
